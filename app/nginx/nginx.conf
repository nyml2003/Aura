worker_processes 1;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  upstream go_backend {
    server go:8080;
  }

  server {
    listen 80;
    server_name localhost;
    root /var/www/frontend;

    # 静态资源：前端构建产物；显式指定 MIME 避免被当作 text/plain
    location /assets/ {
      alias /var/www/frontend/assets/;
      types { application/javascript js; text/css css; }
      default_type application/octet-stream;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # 浏览器/DevTools 自动请求，直接 204 避免转给后端打 404 日志
    location = /.well-known/appspecific/com.chrome.devtools.json {
      return 204;
    }

    # 健康检查（可选）
    location /health {
      proxy_pass http://go_backend/health;
      proxy_set_header Host $host;
    }

    # 页面请求：转发到 Go 网关，返回带 __INIT_DATA__ 的 HTML
    location / {
      proxy_pass http://go_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
