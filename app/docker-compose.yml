# MVP：Node 后端 + Nginx，前端在镜像内构建
# 一键：python run.py

services:
  node:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - SITE_BASE=http://localhost:9080
      - PORT=4000
      - FRONTEND_DIST=/app/frontend/apps/list/dist

  nginx:
    image: nginx:alpine
    ports:
      - "9080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - node
