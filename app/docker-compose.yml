services:
  go:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    # 仅用于本地直连调试；生产由 nginx 代理

  nginx:
    image: nginx:alpine
    ports:
      - "9080:80"   # 开发环境访问 http://localhost:9080
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/apps/list/dist:/var/www/frontend:ro
    depends_on:
      - go
